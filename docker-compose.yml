version: '3.8'

services:
  bot:
    build: .
    command: python -m bot.bot
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

  photo_server:
    build: .
    command: python photo_server.py
    env_file: .env
    environment:
      PHOTO_SERVER_PORT: "8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  admin_web:
    build: .
    command: python admin_web.py
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    ports:
      - "8080:8080"

  celery_worker:
    build: .
    command: celery -A bot.tasks.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  celery_beat:
    build: .
    command: celery -A bot.tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
    volumes:
      - .:/app

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bot_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
